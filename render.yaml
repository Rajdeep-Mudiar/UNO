services:
  - type: web
    name: uno-card-arena-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run db:generate
    startCommand: npm run server:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
